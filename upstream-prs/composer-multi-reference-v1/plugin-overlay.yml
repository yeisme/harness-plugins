- insert:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'
    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000
    - id: dsh-pane-workbench
      name: '@yeisme/dsh-pane-workbench'
    - id: dsh-desktop-workbench
      name: '@yeisme/dsh-desktop-workbench'
    - id: dsh-selection-annotation
      name: '@yeisme/dsh-selection-annotation'
