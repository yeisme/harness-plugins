name: CI

on:
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/**'
      - 'patches/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tsconfig*.json'
      - 'vitest*.ts'
  push:
    branches:
      - develop
      - main
    paths:
      - '.github/workflows/ci.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/**'
      - 'patches/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tsconfig*.json'
      - 'vitest*.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Typecheck / test / build (node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Provision released dsh CLI
        run: npm install --global @deepseek-ai/dsh@0.1.1-rc.2

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle contract check
        run: pnpm check:bundles

  node-22-compat:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    name: Node 22 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Provision released dsh CLI
        run: npm install --global @deepseek-ai/dsh@0.1.1-rc.2

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Compatibility checks
        run: pnpm typecheck && pnpm test
