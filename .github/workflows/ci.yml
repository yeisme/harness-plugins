name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  gates:
    name: Typecheck / test / build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Provision released dsh CLI
        run: npm install --global @deepseek-ai/dsh@0.1.1-rc.2

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle contract check
        run: pnpm check:bundles

      - name: Documentation sync check
        run: node scripts/doc-sync.mjs

  openspec:
    name: OpenSpec strict validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate every active change
        run: |
          status=0
          for d in openspec/changes/*/; do
            [ -f "${d}proposal.md" ] || continue
            name="$(basename "$d")"
            echo "::group::openspec validate ${name}"
            npx -y @fission-ai/openspec@1.6.0 validate "$name" --strict --no-interactive || status=1
            echo "::endgroup::"
          done
          exit $status
