# Yeisme Ordo Agent Ops bundle: one profile patch layer inserting the host
# adapters, /ordo command, client panel, and composition preview as rows.
# Install with: dsh plugin --profile web add @yeisme/dsh-ordo-agent-ops
# (or a local checkout: dsh plugin --profile web add ./packages/bundle/ordo-agent-ops)
- insert:
    - id: ordo-agent-ops
      name: '@yeisme/dsh-host-ordo-agent-ops'

    - id: ordo-commands
      name: '@yeisme/dsh-host-ordo-commands'

    - id: ui-ordo-agent-ops
      name: '@yeisme/dsh-client-ui-ordo-agent-ops'

    - id: agent-composition-preview
      name: '@yeisme/dsh-agent-composition-preview'
