# Yeisme DSH MCP Inspector bundle.
# Install with:
#   dsh plugin --profile web add @yeisme/dsh-mcp-inspector
# or from this checkout:
#   dsh plugin --profile web add ./packages/bundle/dsh-mcp-inspector
#
# This bundle adds one independently identifiable profile row. The Host
# face projects skills/MCP/native catalogs and stores enablement prefs;
# session logs, prompt admission, and plan selection remain with DSH Host.
- insert:
    - id: dsh-mcp-inspector
      name: '@yeisme/dsh-mcp-inspector'
