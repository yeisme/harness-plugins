# Yeisme Pane Workbench bundle.
# Install with:
#   dsh plugin --profile web add @yeisme/dsh-pane-workbench
# or from this checkout:
#   dsh plugin --profile web add ./packages/bundle/pane-workbench
#
# The client package attaches one official workspace owner and registers the
# shell.workspace.right / shell.workspace.bottom occupants. This bundle only
# adds one profile row and never patches the DSH sidebar, conversation,
# details, overlay, or DOM layout.
- insert:
    - id: pane-workbench
      name: '@yeisme/dsh-pane-workbench'
