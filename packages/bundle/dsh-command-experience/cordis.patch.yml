# Cordis patch for DSH Command Experience bundle.
# Install with:
#   dsh plugin --profile <name> add @yeisme/dsh-command-experience
# or from this checkout:
#   dsh plugin --profile <name> add ./packages/bundle/dsh-command-experience
#
# Registers the unified command experience plugin row (client module + host
# capability probe + owner action adapter live in this package's dsh fields).
- insert:
  - id: dsh-command-experience
    name: '@yeisme/dsh-command-experience'
