# Cordis patch for DSH Command Experience bundle
# This defines the bundle configuration for DSH profile patching

dsh:
  bundle:
    id: "@yeisme/dsh-command-experience"
    version: "0.1.0-rc.1"
    name: "Codex Command Experience"
    description: "Unified command experience across Web and TUI with Codex-style /agent thread picker, /resume session picker, and comprehensive command coverage"

    # Capability requirements
    requires:
      - command-directory
      - session-projection
      - thread-projection
      - owner-actions

    # Optional capabilities
    optional:
      - action-receipts
      - thread-hierarchy
      - session-metadata

    # Capabilities provided by this bundle
    provides:
      - unified-command-directory
      - slash-assist
      - agent-thread-picker
      - session-resume-picker
      - command-state-machine
      - compatibility-layer

    # Commands provided
    commands:
      - name: "/help"
        category: "discovery"
        surfaces: ["web", "tui"]
        actionKind: "local"
        danger: "safe"

      - name: "/commands"
        category: "discovery"
        surfaces: ["web", "tui"]
        actionKind: "navigation"
        danger: "safe"

      - name: "/agent"
        category: "session"
        surfaces: ["web", "tui"]
        actionKind: "owner-action"
        danger: "safe"
        description: "Switch agent thread or open thread picker"

      - name: "/subagents"
        category: "session"
        surfaces: ["web", "tui"]
        actionKind: "owner-action"
        danger: "safe"
        description: "View and switch subagent threads"

      - name: "/preset"
        category: "model"
        surfaces: ["web", "tui"]
        actionKind: "owner-action"
        danger: "safe"
        description: "Switch model preset"

      - name: "/resume"
        category: "session"
        surfaces: ["web", "tui"]
        actionKind: "owner-action"
        danger: "safe"
        description: "Resume a saved session"

      - name: "/new"
        category: "session"
        surfaces: ["web", "tui"]
        actionKind: "owner-action"
        danger: "safe"
        description: "Create a new chat"

      - name: "/fork"
        category: "session"
        surfaces: ["web", "tui"]
        actionKind: "owner-action"
        danger: "safe"
        description: "Fork the current chat"

      - name: "/rename"
        category: "session"
        surfaces: ["web", "tui"]
        actionKind: "owner-action"
        danger: "safe"
        description: "Rename the current session"

      - name: "/compact"
        category: "session"
        surfaces: ["web", "tui"]
        actionKind: "owner-action"
        danger: "safe"
        description: "Compact the conversation context"

    # Compatibility mappings
    compatibility:
      - legacy: ":"
        canonical: "/"
        deprecated: true
        removeAfter: "1.0.0"

      - legacy: "/agent <preset>"
        canonical: "/preset <preset>"
        deprecated: true
