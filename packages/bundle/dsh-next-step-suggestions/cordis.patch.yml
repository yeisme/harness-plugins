# Yeisme DSH Next-Step Suggestions bundle.
# Install with:
#   dsh plugin --profile web add @yeisme/dsh-next-step-suggestions
# or from this checkout:
#   dsh plugin --profile web add ./packages/bundle/dsh-next-step-suggestions
#
# This bundle adds one independently identifiable profile row. Session logs,
# prompt admission, and plan selection remain with DSH Host.
- insert:
    - id: dsh-next-step-suggestions
      name: '@yeisme/dsh-next-step-suggestions'
